name: release-artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '\r\n' < skills/intent-driven-naming/VERSION)"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Run release checks
        run: python scripts/run_checks.py
      - name: Build deterministic runtime artifacts
        run: python scripts/build_release.py --clean
      - name: Attest runtime archive
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/*.zip
      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intent-driven-naming-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
