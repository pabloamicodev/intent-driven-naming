name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline-suite:
    name: offline suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-dev.lock
      - name: Validate JSON contracts
        run: python scripts/validate_schemas.py
      - name: Lint Python
        run: ruff check .
      - name: Type check
        run: python -m mypy
      - name: Run offline checks
        run: python scripts/run_checks.py

  strict-language-fixtures:
    name: strict language fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
          cache: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned TypeScript
        run: npm install --global typescript@5.2.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.80.1 --profile minimal && rustup default 1.80.1
      - name: Verify every required tool fixture
        run: python harness/verify_fixtures.py --strict-tools
      - name: Smoke-test local runtime installation
        shell: bash
        run: |
          destination="$RUNNER_TEMP/intent-driven-naming"
          python scripts/install_local_skill.py --destination "$destination"
          python scripts/install_local_skill.py --destination "$destination" --check
