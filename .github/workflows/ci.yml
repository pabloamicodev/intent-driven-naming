name: conformance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-suite:
    name: offline suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.lock
      - name: Validate JSON contracts
        run: python scripts/validate_schemas.py
      - name: Lint Python
        run: ruff check .
      - name: Run offline checks
        run: python scripts/run_checks.py

  strict-language-fixtures:
    name: strict language fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"
      - name: Install pinned TypeScript
        run: npm install --global typescript@5.2.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.80.1 --profile minimal && rustup default 1.80.1
      - name: Verify every required tool fixture
        run: python harness/verify_fixtures.py --strict-tools
      - name: Smoke-test local runtime installation
        shell: bash
        run: |
          destination="$RUNNER_TEMP/intent-driven-naming"
          python scripts/install_local_skill.py --destination "$destination"
          python scripts/install_local_skill.py --destination "$destination" --check
